<!doctype html>
<html lang="en" data-theme="notebro">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#fffaf0" />
		<meta
			name="description"
			content="In a world of Word, be Notepad. NoteBro is a zero-friction notes app that's already taking your note when you open it. No headers, no folders, just a cursor."
		/>
		<meta name="author" content="Pablo Alvarado (@pibulus)" />
		<link rel="canonical" href="https://notebro.app" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://notebro.app" />
		<meta property="og:title" content="NoteBro 📝 — In a world of Word, be Notepad." />
		<meta
			property="og:description"
			content="A zero-friction notes app that's already taking your note when you open it. No headers, no folders, just a cursor."
		/>
		<meta property="og:image" content="https://notebro.app/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="NoteBro" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://notebro.app" />
		<meta name="twitter:title" content="NoteBro 📝 — In a world of Word, be Notepad." />
		<meta
			name="twitter:description"
			content="A zero-friction notes app that's already taking your note when you open it. No headers, no folders, just a cursor."
		/>
		<meta name="twitter:image" content="https://notebro.app/og-image.png" />
		<meta name="twitter:creator" content="@pibulus" />

		<title>NoteBro 📝 — In a world of Word, be Notepad.</title>
		%sveltekit.head%
	</head>
	<body class="bg-[#fffaf0] text-[#1e1714] min-h-screen antialiased selection:bg-[#fef08a] selection:text-[#1e1714]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
